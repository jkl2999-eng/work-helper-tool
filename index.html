<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리시브 마감 자동화 도구</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f7f9; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #1e88e5; text-align: center; }
        .file-box { border: 2px dashed #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .file-input { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 15px; background-color: #1e88e5; color: white; border: none; cursor: pointer; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #1565c0; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 14px; min-height: 50px; background-color: #f8f9fa; border: 1px solid #eee; }
        .new-sku-box { background-color: #fff9c4; border-left: 5px solid #fbc02d; padding: 15px; margin-top: 20px; display: none; }
        #download_area { display: none; margin-top: 20px; text-align: center; }
        #download_link { font-size: 18px; color: #1e88e5; font-weight: bold; text-decoration: none; border: 2px solid #1e88e5; padding: 10px 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 리시브 마감 자동화</h2>
    <div id="status">⏳ 시스템 초기화 중...</div>

    <div class="file-box">
        <div class="file-input"><span>📁 1. 마감 양식 (.xlsx)</span> <input type="file" id="target_file"></div>
        <div class="file-input"><span>📄 2. 검품 내역 (.xlsx)</span> <input type="file" id="check_file"></div>
        <div class="file-input"><span>📄 3. TruckShipment (.xlsx)</span> <input type="file" id="ts_file"></div>
        <div class="file-input"><span>📋 4. PO_SKU_LIST (.xlsx)</span> <input type="file" id="po_file"></div>
    </div>
    
    <button id="run_btn" disabled>🚀 공정 시작</button>
    
    <div id="sku_result" class="new-sku-box"></div>
    <div id="download_area">
        <p style="margin-bottom: 15px; font-weight: bold;">🎉 작업이 완료되었습니다!</p>
        <a id="download_link">📥 [ 마감완료 파일 다운로드 ]</a>
    </div>
</div>

<py-config>
    packages = ["pandas", "openpyxl"]
</py-config>

<script type="py">
import pandas as pd
import openpyxl
import asyncio
import io
from pyscript import window
from js import Uint8Array, URL, document, Blob

status_el = document.getElementById("status")
run_btn = document.getElementById("run_btn")
status_el.innerHTML = "✅ 준비 완료! 파일을 선택해 주세요."
run_btn.disabled = False

async def process_files(event):
    status = document.getElementById("status")
    sku_div = document.getElementById("sku_result")
    dl_area = document.getElementById("download_area")
    
    status.innerHTML = "⏳ 공정 시작..."
    await asyncio.sleep(0.1)

    try:
        # 파일 로드 함수
        async def get_df(elem_id):
            el = document.getElementById(elem_id)
            if not el.files or el.files.length == 0: return None
            buf = await el.files.item(0).arrayBuffer()
            return pd.read_excel(io.BytesIO(buf.to_py()))

        target_el = document.getElementById("target_file")
        if not target_el.files.length:
            window.alert("마감 양식 파일을 선택해주세요!")
            return

        target_buf = await target_el.files.item(0).arrayBuffer()
        ts_f = await get_df("ts_file")
        po_f = await get_df("po_file")
        chk_f = await get_df("check_file")

        wb = openpyxl.load_workbook(io.BytesIO(target_buf.to_py()))

        # [핵심] 수식 보호 데이터 주입 함수
        def fill_safe(ws, df, start_row=2, max_col_limit=None):
            if df is None: return
            # 1. 기존 데이터 삭제 (수식 제외)
            limit = max_col_limit if max_col_limit else ws.max_column
            for r in range(start_row, ws.max_row + 1):
                for c in range(1, limit + 1):
                    cell = ws.cell(r, c)
                    # 수식('f')이 아닌 경우에만 값을 비움
                    if cell.data_type != 'f':
                        cell.value = None

            # 2. 새 데이터 주입 (수식 제외)
            data = df.values.tolist()
            for r_idx, row_vals in enumerate(data, start_row):
                for c_idx, val in enumerate(row_vals, 1):
                    if max_col_limit and c_idx > max_col_limit: break
                    cell = ws.cell(r_idx, c_idx)
                    # 수식 셀은 건너뛰고 일반 데이터만 입력
                    if cell.data_type != 'f':
                        cell.value = val if pd.notna(val) else ""

        # 1. TruckShipment 주입
        status.innerHTML = "⏳ TruckShipment 데이터 주입 중..."
        ts_sheet = next((s for s in wb.sheetnames if "TRUCK" in s.upper()), None)
        if ts_sheet and ts_f is not None:
            fill_safe(wb[ts_sheet], ts_f)

        # 2. PO_SKU_LIST 주입 (BC열/55번까지만)
        status.innerHTML = "⏳ PO_SKU_LIST 데이터 주입 중..."
        po_sheet = next((s for s in wb.sheetnames if "PO" in s.upper()), None)
        if po_sheet and po_f is not None:
            fill_safe(wb[po_sheet], po_f, max_col_limit=55)

        # 3. 검품 내역 주입
        status.innerHTML = "⏳ 검품 내역 데이터 주입 중..."
        if "검품 내역" in wb.sheetnames and chk_f is not None:
            fill_safe(wb["검품 내역"], chk_f)

        # 4. New SKU 감지 및 표시
        if ts_f is not None:
            df_ts_clean = ts_f.copy()
            df_ts_clean.columns = [str(c).strip() for c in df_ts_clean.columns]
            if "온도" in df_ts_clean.columns and "SKUID" in df_ts_clean.columns:
                new_skus = df_ts_clean[df_ts_clean["온도"].astype(str).str.contains("NEW", na=False)]["SKUID"].unique()
                if len(new_skus) > 0:
                    sku_div.style.display = "block"
                    sku_div.innerHTML = f"📢 <b>New SKU 발견 ({len(new_skus)}건):</b> {', '.join(map(str, new_skus))}"

        # 5. 결과 저장 및 다운로드
        status.innerHTML = "⏳ 최종 파일 생성 중..."
        out_buf = io.BytesIO()
        wb.save(out_buf)
        
        processed_blob = Blob.new([Uint8Array.new(out_buf.getvalue())], { "type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" })
        link = document.getElementById("download_link")
        link.href = URL.createObjectURL(processed_blob)
        link.download = "리시브_마감_완료.xlsx"
        
        dl_area.style.display = "block"
        status.innerHTML = "✅ 모든 작업이 완료되었습니다!"

    except Exception as e:
        status.innerHTML = f"❌ 오류 발생: {str(e)}"
        print(e)

run_btn.onclick = process_files
</script>
</body>
</html>
