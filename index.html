<script type="py">
import pandas as pd
import io
from pyscript import window
from js import document, Uint8Array, Blob, URL, CustomEvent

async def python_logic(event):
    status = document.getElementById("status")
    dl_area = document.getElementById("download-area")
    sku_area = document.getElementById("new-sku-area")
    btn = document.getElementById("run-btn")

    try:
        f_target = document.getElementById("target-file").files.item(0)
        f_ts = document.getElementById("src-ts").files.item(0)
        f_po = document.getElementById("src-po").files.item(0)
        f_check = document.getElementById("src-check").files.item(0)

        if not all([f_target, f_ts, f_po, f_check]):
            window.alert("4개의 파일을 모두 선택해 주세요!")
            status.style.display = "none"
            btn.disabled = False
            return

        combined_rows = []
        new_skus = []

        # --- 1. TruckShipment 분석 ---
        ts_buf = await f_ts.arrayBuffer()
        ts_df = pd.read_excel(io.BytesIO(Uint8Array.new(ts_buf).to_py())).astype(str)
        t_cols = [c for c in ts_df.columns if "온도" in str(c)]
        if t_cols:
            t_col = t_cols[0]
            # NEW SKU (V열 주변)
            new_mask = ts_df[t_col].str.contains("NEW", case=False, na=False)
            new_skus = ts_df[new_mask].iloc[:, 13].replace('nan', '').unique().tolist()
            # 냉동 데이터 (B, C, L, N, O, U열 순서 가정)
            ts_f = ts_df[ts_df[t_col].str.contains("냉동", na=False)]
            for _, row in ts_f.iterrows():
                combined_rows.append([
                    row.iloc[1],  # 업체ID
                    row.iloc[2],  # 업체명
                    row.iloc[11], # 발주번호
                    row.iloc[13], # SKU ID
                    row.iloc[14], # 상품명
                    row.iloc[20]  # 수량 (U열)
                ])

        # --- 2. PO_SKU_LIST 분석 ---
        po_buf = await f_po.arrayBuffer()
        po_df = pd.read_excel(io.BytesIO(Uint8Array.new(po_buf).to_py())).astype(str)
        p_t_cols = [c for c in po_df.columns if "온도" in str(c)]
        if p_t_cols and len(po_df.columns) >= 14:
            p_t, p_m = p_t_cols[0], po_df.columns[13]
            po_f = po_df[(po_df[p_t].str.contains("냉동", na=False)) & (po_df[p_m].str.contains("밀크런", na=False))]
            for _, row in po_f.iterrows():
                combined_rows.append([
                    row.iloc[7],  # 업체ID (H열)
                    row.iloc[8],  # 업체명 (I열)
                    row.iloc[0],  # 발주번호 (A열)
                    row.iloc[2],  # SKU ID (C열)
                    row.iloc[6],  # 상품명 (G열)
                    row.iloc[25]  # 수량 (Z열)
                ])

        # --- 3. 검품내역 분석 ---
        check_buf = await f_check.arrayBuffer()
        check_df = pd.read_excel(io.BytesIO(Uint8Array.new(check_buf).to_py())).astype(str)
        for _, row in check_df.iterrows():
            if len(row) >= 6:
                combined_rows.append([row.iloc[0], row.iloc[1], row.iloc[2], row.iloc[3], row.iloc[4], row.iloc[5]])

        # --- 4. 양식 주입 (정밀 보정) ---
        target_buf = await f_target.arrayBuffer()
        target_io = io.BytesIO(Uint8Array.new(target_buf).to_py())
        
        # 주입할 데이터 정리
        final_df = pd.DataFrame(combined_rows)
        
        # openpyxl을 직접 사용하여 시트 내용을 초기화한 후 주입
        from openpyxl import load_workbook
        wb = load_workbook(target_io)
        if 'RCV Check' in wb.sheetnames:
            ws = wb['RCV Check']
            # 데이터 시작점(2행)부터 아래로 500행까지 기존 내용 삭제 (깔끔하게 비우기)
            for row in ws.iter_rows(min_row=2, max_row=500, min_col=1, max_col=6):
                for cell in row:
                    cell.value = None
            
            # 새 데이터 입력
            for r_idx, row_data in enumerate(combined_rows, start=2):
                for c_idx, value in enumerate(row_data, start=1):
                    ws.cell(row=r_idx, column=c_idx, value=value)
        
        # 메모리에 저장
        output = io.BytesIO()
        wb.save(output)
        output.seek(0)

        # UI 업데이트
        if new_skus and any(new_skus):
            sku_area.style.display = "block"
            document.getElementById("new-sku-list").innerText = ", ".join([str(s) for s in new_skus if s])

        url = URL.createObjectURL(Blob.new([Uint8Array.new(output.read())], {"type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))
        status.innerText = f"✅ 총 {len(combined_rows)}건의 데이터를 정확히 주입했습니다."
        dl_area.style.display = "block"
        
        def dl_handler(e):
            a = document.createElement("a"); a.href = url; a.download = "RCV_결과.xlsx"; a.click()
        from pyodide.ffi import create_proxy
        document.getElementById("dl-btn").onclick = create_proxy(dl_handler)

    except Exception as e:
        status.className = "error"
        status.innerText = f"❌ 오류 발생: {str(e)}"
    finally:
        btn.disabled = False

from pyodide.ffi import create_proxy
window.addEventListener('start-python-logic', create_proxy(python_logic))
</script>
