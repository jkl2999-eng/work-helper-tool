<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리시브 마감 자동화 시스템</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        html, body { height: 100%; margin: 0; display: flex; justify-content: center; align-items: center; background-color: #f0f2f5; font-family: 'Malgun Gothic', sans-serif; }
        .container { width: 95%; max-width: 550px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #1e88e5; margin-bottom: 25px; }
        .file-input-group { text-align: left; background: #fafafa; padding: 15px; border-radius: 10px; border: 1px solid #eee; margin-bottom: 15px; }
        .file-input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; font-size: 13px; }
        input[type="file"] { width: 100%; font-size: 12px; }
        button { width: 100%; padding: 15px; background-color: #1e88e5; color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; cursor: pointer; }
        button:disabled { background-color: #dadce0; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 12px; border-radius: 8px; display: none; font-size: 14px; font-weight: bold; border: 1px solid #1e88e5; background: #e3f2fd; color: #1565c0; }
        .new-sku-box { background-color: #fff9c4; border-left: 5px solid #fbc02d; padding: 15px; margin-top: 20px; display: none; text-align: left; border-radius: 4px; font-size: 13px; }
        #download_area { display: none; margin-top: 20px; padding: 20px; border: 2px solid #4caf50; border-radius: 8px; background: #f1f8e9; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 RCV 마감 자동화</h2>
    
    <div class="file-input-group"><label>📁 1. 마감 양식 (.xlsx)</label><input type="file" id="target_file"></div>
    <div class="file-input-group"><label>📄 2. TruckShipment (.xlsx)</label><input type="file" id="ts_file"></div>
    <div class="file-input-group"><label>📋 3. PO_SKU_LIST (.xlsx)</label><input type="file" id="po_file"></div>
    <div class="file-input-group"><label>📑 4. 검품 내역 (.xlsx)</label><input type="file" id="actual_check_file"></div>

    <button id="run_btn" onclick="startLoading()">공정 시작</button>

    <div id="status"></div>
    <div id="sku_result" class="new-sku-box"></div>
    
    <div id="download_area">
        <p style="color: #2e7d32; font-weight: bold;">🎉 모든 작업이 완료되었습니다!</p>
        <a id="download_link" style="display: block; padding: 10px; background: #4caf50; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; text-align: center;">📥 결과 파일 다운로드</a>
    </div>
</div>

<script>
    function startLoading() {
        const s = document.getElementById("status");
        s.style.display = "block";
        s.innerText = "⏳ 데이터 분석 중... (잠시만 기다려주세요)";
        document.getElementById("run_btn").disabled = true;
        setTimeout(() => { window.dispatchEvent(new CustomEvent('start-process')); }, 100);
    }
</script>

<py-config>
    packages = ["pandas", "openpyxl"]
</py-config>

<script type="py">
import pandas as pd
import openpyxl
import io
import asyncio
from pyscript import window # window 객체를 명확히 임포트
from js import document, Uint8Array, Blob, URL

async def run_process(event):
    status = document.getElementById("status")
    sku_div = document.getElementById("sku_result")
    dl_area = document.getElementById("download_area")
    
    try:
        f_target = document.getElementById("target_file").files.item(0)
        f_ts = document.getElementById("ts_file").files.item(0)
        f_po = document.getElementById("po_file").files.item(0)
        f_check = document.getElementById("actual_check_file").files.item(0)

        if not all([f_target, f_ts, f_po, f_check]):
            window.alert("4개의 파일을 모두 선택해야 합니다!")
            return

        async def load_df(f):
            buf = await f.arrayBuffer()
            df = pd.read_excel(io.BytesIO(buf.to_py())).astype(str)
            df.columns = [str(c).strip().upper().replace(" ", "") for c in df.columns]
            return df

        df_ts = await load_df(f_ts)
        df_po = await load_df(f_po)
        df_check = await load_df(f_check)
        
        rcv_data = []
        new_skus = []

        # 1. TruckShipment 분석 및 New SKU 감지 로직
        ts_temp_col = next((c for c in df_ts.columns if "온도" in c), None)
        ts_id_col = next((c for c in df_ts.columns if "SKUID" in c or "상품코드" in c), None)
        
        if ts_temp_col:
            # NEW 포함 여부 확인 (대소문자 무시)
            mask_new = df_ts[ts_temp_col].str.contains('NEW', case=False, na=False)
            new_skus = df_ts.loc[mask_new, ts_id_col].unique().tolist() if ts_id_col else []
            
            # 냉동 데이터 추출
            ts_f = df_ts[df_ts[ts_temp_col].str.contains('냉동', na=False)]
            for _, r in ts_f.iterrows():
                rcv_data.append([r.iloc[1], r.iloc[2], r.iloc[11], r.iloc[13], r.iloc[14], r.iloc[20]])

        # 2. PO_SKU_LIST 분석
        po_temp_col = next((c for c in df_po.columns if "온도" in c), None)
        po_milk_col = next((c for c in df_po.columns if "운송" in c or "밀크런" in c), None)
        
        if po_temp_col and po_milk_col:
            po_f = df_po[df_po[po_temp_col].str.contains('냉동', na=False) & df_po[po_milk_col].str.contains('밀크런', na=False)]
            for _, r in po_f.iterrows():
                rcv_data.append([r.iloc[7], r.iloc[8], r.iloc[0], r.iloc[2], r.iloc[6], r.iloc[25]])

        # 3. 양식 시트 주입
        target_buf = await f_target.arrayBuffer()
        wb = openpyxl.load_workbook(io.BytesIO(target_buf.to_py()))
        
        def fill_sheet(sheet_name, data_list, max_col):
            if sheet_name in wb.sheetnames:
                ws = wb[sheet_name]
                # 기존 데이터 삭제 (헤더 제외)
                for row in ws.iter_rows(min_row=2, max_row=ws.max_row+50, min_col=1, max_col=max_col):
                    for cell in row: cell.value = None
                # 데이터 주입
                for i, row_vals in enumerate(data_list, 2):
                    for j, val in enumerate(row_vals, 1):
                        ws.cell(row=i, column=j, value=val if val != 'nan' else "")

        fill_sheet('RCV Check', rcv_data, 6)
        
        ts_name = 'TRUCKSHIPMENT' if 'TRUCKSHIPMENT' in wb.sheetnames else 'TruckShipment'
        fill_sheet(ts_name, df_ts.values.tolist(), len(df_ts.columns))
        
        fill_sheet('검품내역', df_check.values.tolist(), len(df_check.columns))

        # 4. 결과 표시
        if new_skus:
            sku_div.style.display = "block"
            sku_div.innerHTML = f"📢 <b>New SKU 발견:</b> {', '.join([str(s) for s in new_skus if s != 'nan'])}"

        out = io.BytesIO()
        wb.save(out)
        blob = Blob.new([Uint8Array.new(out.getvalue())], {"type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})
        
        link = document.getElementById("download_link")
        link.href = URL.createObjectURL(blob)
        link.download = "RCV_결과_최종.xlsx"
        dl_area.style.display = "block"
        status.innerText = f"✅ 처리 완료! (RCV용 데이터: {len(rcv_data)}건)"

    except Exception as e:
        status.innerText = f"❌ 오류 발생: {str(e)}"
        document.getElementById("run_btn").disabled = False

from pyodide.ffi import create_proxy
document.addEventListener('start-process', create_proxy(run_process)) # window 대신 document 사용 권장
</script>
</body>
</html>
