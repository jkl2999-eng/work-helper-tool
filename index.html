<div class="container">
    <h2>🚀 리시브 마감 자동 통합 (New SKU 감지 포함)</h2>
    
    <div class="file-group"><label>📁 1. 통합 양식 파일 (RCV Check 시트 포함)</label><input type="file" id="target-file" accept=".xlsx"></div>
    <div class="file-group"><label>📄 2. TruckShipment (냉동 및 New SKU 추출)</label><input type="file" id="src-ts" accept=".xlsx"></div>
    <div class="file-group"><label>📋 3. PO_SKU_LIST (밀크런 데이터 추출)</label><input type="file" id="src-po" accept=".xlsx"></div>
    <div class="file-group"><label>📑 4. 검품내역 (데이터 추출)</label><input type="file" id="src-check" accept=".xlsx"></div>

    <button id="run-btn">분석 및 양식에 주입 시작</button>

    <div id="new-sku-area" style="display:none; background-color: #fff4e5; border-left: 5px solid #ffa000; padding: 15px; margin-top: 20px; border-radius: 4px;">
        <strong style="color: #e67e22;">📢 [New SKU 감지]</strong><br>
        보안 사이트에서 먼저 조회해야 할 SKUID:<br>
        <span id="new-sku-list" style="font-weight: bold; word-break: break-all;"></span>
    </div>

    <div id="status"></div>
    <div id="download-area">
        <p>✅ 데이터 주입이 완료되었습니다!</p>
        <button id="dl-btn" style="background-color: #34a853;">결과 파일 다운로드 (.xlsx)</button>
    </div>
</div>

<py-config>
    packages = ["pandas", "openpyxl"]
</py-config>

<script type="py">
import pandas as pd
import io
from pyscript import window
from js import document, Uint8Array, Blob, URL

async def process(event):
    status = document.getElementById("status")
    dl_area = document.getElementById("download-area")
    sku_area = document.getElementById("new-sku-area")
    sku_list_span = document.getElementById("new-sku-list")
    
    f_target = document.getElementById("target-file").files[0]
    f_ts = document.getElementById("src-ts").files[0]
    f_po = document.getElementById("src-po").files[0]
    f_check = document.getElementById("src-check").files[0]

    if not all([f_target, f_ts, f_po, f_check]):
        window.alert("4개의 파일을 모두 선택해 주세요!")
        return

    status.className = "status info"
    status.style.display = "block"
    status.innerText = "데이터 통합 중..."
    sku_area.style.display = "none" # 초기화

    try:
        combined_rows = []
        new_skus = []

        # --- A. TruckShipment (소스 1) ---
        ts_buf = await f_ts.arrayBuffer()
        ts_df = pd.read_excel(io.BytesIO(Uint8Array.new(ts_buf).to_py())).astype(str)
        t_col = [c for c in ts_df.columns if "온도" in str(c)][0]
        
        # 1. New SKU 추출 (V열에 NEW가 포함된 경우)
        mask_new = ts_df[t_col].str.contains("NEW", case=False, na=False)
        new_skus = ts_df[mask_new].iloc[:, 13].dropna().unique().tolist() # N열(SKUID)

        # 2. 냉동 데이터 추출
        ts_f = ts_df[ts_df[t_col].str.contains("냉동", na=False)]
        for _, row in ts_f.iterrows():
            combined_rows.append([row.iloc[1], row.iloc[2], row.iloc[11], row.iloc[13], row.iloc[14], row.iloc[20]])

        # --- B. PO_SKU_LIST (소스 2) ---
        po_buf = await f_po.arrayBuffer()
        po_df = pd.read_excel(io.BytesIO(Uint8Array.new(po_buf).to_py())).astype(str)
        p_t_col = [c for c in po_df.columns if "온도" in str(c)][0]
        p_m_col = po_df.columns[13] # 밀크런 열
        po_f = po_df[(po_df[p_t_col].str.contains("냉동", na=False)) & (po_df[p_m_col].str.contains("밀크런", na=False))]
        for _, row in po_f.iterrows():
            combined_rows.append([row.iloc[7], row.iloc[8], row.iloc[0], row.iloc[2], row.iloc[6], row.iloc[25]])

        # --- C. 검품내역 (소스 3) ---
        check_buf = await f_check.arrayBuffer()
        check_df = pd.read_excel(io.BytesIO(Uint8Array.new(check_buf).to_py())).astype(str)
        for _, row in check_df.iterrows():
            if len(row) >= 6:
                combined_rows.append([row.iloc[0], row.iloc[1], row.iloc[2], row.iloc[3], row.iloc[4], row.iloc[5]])

        # --- D. 양식에 주입 ---
        target_buf = await f_target.arrayBuffer()
        target_bytes = io.BytesIO(Uint8Array.new(target_buf).to_py())
        output_df = pd.DataFrame(combined_rows)
        with pd.ExcelWriter(target_bytes, engine='openpyxl', mode='a', if_sheet_exists='overlay') as writer:
            output_df.to_excel(writer, sheet_name='RCV Check', startrow=1, index=False, header=False)

        # 화면 업데이트
        if new_skus:
            sku_area.style.display = "block"
            sku_list_span.innerText = ", ".join(map(str, new_skus))
        
        target_bytes.seek(0)
        blob = Blob.new([Uint8Array.new(target_bytes.read())], {"type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})
        url = URL.createObjectURL(blob)
        status.innerText = f"성공! 총 {len(combined_rows)}개 데이터를 주입했습니다."
        dl_area.style.display = "block"
        
        def dl(e):
            a = document.createElement("a"); a.href = url; a.download = "RCV_최종결과.xlsx"; a.click()
        from pyodide.ffi import create_proxy
        document.getElementById("dl-btn").onclick = create_proxy(dl)

    except Exception as e:
        status.innerText = f"오류 발생: {str(e)}"
    
from pyodide.ffi import create_proxy
document.getElementById("run-btn").addEventListener("click", create_proxy(process))
</script>
