<script type="py">
import pandas as pd
import io
from pyscript import window
from js import document, Uint8Array, Blob, URL

async def main_process(event):
    status = document.getElementById("status")
    dl_section = document.getElementById("download-section")
    btn = document.getElementById("run-btn")
    
    files = document.getElementById("file-input").files
    if not files:
        window.alert("파일을 선택해 주세요.")
        return

    btn.disabled = True
    status.className = "status info"
    status.style.display = "block"
    status.innerText = "데이터 정밀 분석 및 주입 중..."
    
    target_bytes = None
    source_files = []
    combined_rows = []
    new_skus = []

    try:
        # 1단계: 파일 분류
        for file in files:
            array_buf = await file.arrayBuffer()
            content = io.BytesIO(Uint8Array.new(array_buf).to_py())
            xl = pd.ExcelFile(content)
            if "RCV Check" in xl.sheet_names:
                target_bytes = content
            else:
                source_files.append(content)

        if target_bytes is None:
            raise Exception("양식 파일을 찾을 수 없습니다. 'RCV Check' 시트 이름을 확인하세요.")

        # 2단계: 소스 파일 데이터 추출
        for src in source_files:
            src.seek(0)
            # 모든 데이터를 문자열로 읽어서 데이터 누락 방지
            df = pd.read_excel(src).astype(str)
            
            # (A) TruckShipment 처리: '온도'라는 단어가 포함된 열 찾기
            temp_col = None
            for col in df.columns:
                if "온도" in str(col):
                    temp_col = col
                    break
            
            if temp_col is not None and len(df.columns) >= 20:
                # NEW SKU 추출
                mask_new = df[temp_col].str.contains("NEW", case=False, na=False)
                # N열(13번 인덱스) 주변에서 SKUID 추출 (보통 13~14번째)
                new_skus.extend(df[mask_new].iloc[:, 13].replace('nan', None).dropna().unique().tolist())
                
                # 냉동 데이터 추출
                mask_f = df[temp_col].str.contains("냉동", na=False)
                target_df = df[mask_f]
                for _, row in target_df.iterrows():
                    combined_rows.append([
                        row.iloc[1],  # 업체ID
                        row.iloc[2],  # 업체명
                        row.iloc[11], # 발주번호
                        row.iloc[13], # SKU ID
                        row.iloc[14], # 상품명
                        row.iloc[20]  # 수량
                    ])

            # (B) PO_SKU_LIST 처리
            elif len(df.columns) >= 13 and any("온도" in str(c) for c in df.columns[:15]):
                # 온도 열 다시 찾기 (M열 부근)
                p_temp_col = [c for c in df.columns if "온도" in str(c)][0]
                p_type_col = df.columns[13] # 밀크런 여부 열
                
                mask_p = (df[p_temp_col].str.contains("냉동", na=False)) & \
                         (df[p_type_col].str.contains("밀크런", na=False))
                
                for _, row in df[mask_p].iterrows():
                    combined_rows.append([
                        row.iloc[7], row.iloc[8], row.iloc[0], 
                        row.iloc[2], row.iloc[6], row.iloc[25]
                    ])

        # 3단계: 양식 파일에 데이터 쓰기
        target_bytes.seek(0)
        if not combined_rows:
            raise Exception("소스 파일에서 조건(냉동/밀크런)에 맞는 데이터를 찾지 못했습니다.")

        output_df = pd.DataFrame(combined_rows)
        with pd.ExcelWriter(target_bytes, engine='openpyxl', mode='a', if_sheet_exists='overlay') as writer:
            output_df.to_excel(writer, sheet_name='RCV Check', startrow=1, index=False, header=False)
        
        # 4단계: 결과 전송
        target_bytes.seek(0)
        blob = Blob.new([Uint8Array.new(target_bytes.read())], { "type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" })
        url = URL.createObjectURL(blob)
        
        status.innerText = f"성공! {len(combined_rows)}행을 주입했습니다."
        dl_section.style.display = "block"
        
        def dl_click(e):
            a = document.createElement("a")
            a.href = url
            a.download = "RCV_결과물.xlsx"
            a.click()
        from pyodide.ffi import create_proxy
        document.getElementById("dl-btn").onclick = create_proxy(dl_click)

    except Exception as e:
        status.className = "status error"
        status.innerText = f"오류: {str(e)}"
    finally:
        btn.disabled = False

from pyodide.ffi import create_proxy
document.getElementById("run-btn").addEventListener("click", create_proxy(main_process))
</script>
