<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리시브 마감 자동화 시스템</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        /* 중앙 정렬 및 배경 스타일 */
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            width: 100%;
            max-width: 600px; 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center;
        }
        h2 { color: #1a73e8; margin-bottom: 25px; }
        .file-group { 
            text-align: left; 
            margin-bottom: 20px; 
            padding: 15px; 
            border: 1px solid #e8eaed; 
            border-radius: 8px; 
        }
        .file-group label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 10px; 
            color: #5f6368;
            font-size: 14px;
        }
        input[type="file"] { width: 100%; font-size: 13px; }
        
        button { 
            width: 100%; 
            background-color: #1a73e8; 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #dadce0; cursor: not-allowed; }

        #status { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; }
        .info { background-color: #e8f0fe; color: #1967d2; }
        .error { background-color: #fce8e6; color: #c5221f; }

        #new-sku-area { 
            display:none; 
            background-color: #fff4e5; 
            border-left: 5px solid #ffa000; 
            padding: 15px; 
            margin-top: 20px; 
            text-align: left;
            font-size: 14px;
        }
        #download-area { 
            margin-top: 25px; 
            display: none; 
            padding: 20px; 
            border: 2px solid #34a853; 
            border-radius: 10px; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 RCV 자동 통합 시스템</h2>
    
    <div class="file-group">
        <label>📁 1. 통합 양식 파일 (RCV Check 시트)</label>
        <input type="file" id="target-file" accept=".xlsx">
    </div>
    <div class="file-group">
        <label>📄 2. TruckShipment (소스)</label>
        <input type="file" id="src-ts" accept=".xlsx">
    </div>
    <div class="file-group">
        <label>📋 3. PO_SKU_LIST (소스)</label>
        <input type="file" id="src-po" accept=".xlsx">
    </div>
    <div class="file-group">
        <label>📑 4. 검품내역 (소스)</label>
        <input type="file" id="src-check" accept=".xlsx">
    </div>

    <button id="run-btn">데이터 분석 및 주입 시작</button>

    <div id="status"></div>

    <div id="new-sku-area">
        <strong style="color: #e67e22;">📢 [New SKU 감지]</strong><br>
        조회 필요 ID: <span id="new-sku-list" style="font-weight: bold;"></span>
    </div>

    <div id="download-area">
        <p style="color: #2e7d32; font-weight: bold; margin-bottom: 15px;">✅ 통합이 완료되었습니다!</p>
        <button id="dl-btn" style="background-color: #34a853;">통합 파일 다운로드</button>
    </div>
</div>

<py-config>
    packages = ["pandas", "openpyxl"]
</py-config>

<script type="py">
import pandas as pd
import io
from pyscript import window
from js import document, Uint8Array, Blob, URL

async def process(event):
    status = document.getElementById("status")
    dl_area = document.getElementById("download-area")
    sku_area = document.getElementById("new-sku-area")
    sku_list_span = document.getElementById("new-sku-list")
    btn = document.getElementById("run-btn")

    # 파일 가져오기
    f_target = document.getElementById("target-file").files[0]
    f_ts = document.getElementById("src-ts").files[0]
    f_po = document.getElementById("src-po").files[0]
    f_check = document.getElementById("src-check").files[0]

    if not all([f_target, f_ts, f_po, f_check]):
        window.alert("4개의 파일을 모두 선택해야 작동합니다!")
        return

    btn.disabled = True
    status.className = "info"
    status.style.display = "block"
    status.innerText = "데이터 처리 중... (파일 용량에 따라 최대 20초 소요)"
    sku_area.style.display = "none"

    try:
        combined_rows = []
        new_skus = []

        # --- A. TruckShipment 처리 ---
        ts_buf = await f_ts.arrayBuffer()
        ts_df = pd.read_excel(io.BytesIO(Uint8Array.new(ts_buf).to_py())).astype(str)
        
        t_col_list = [c for c in ts_df.columns if "온도" in str(c)]
        if t_col_list:
            t_col = t_col_list[0]
            # New SKU (V열 NEW 포함)
            mask_new = ts_df[t_col].str.contains("NEW", case=False, na=False)
            new_skus = ts_df[mask_new].iloc[:, 13].replace('nan', '').unique().tolist()
            
            # 냉동 필터
            ts_f = ts_df[ts_df[t_col].str.contains("냉동", na=False)]
            for _, row in ts_f.iterrows():
                combined_rows.append([row.iloc[1], row.iloc[2], row.iloc[11], row.iloc[13], row.iloc[14], row.iloc[20]])

        # --- B. PO_SKU_LIST 처리 ---
        po_buf = await f_po.arrayBuffer()
        po_df = pd.read_excel(io.BytesIO(Uint8Array.new(po_buf).to_py())).astype(str)
        p_t_cols = [c for c in po_df.columns if "온도" in str(c)]
        if p_t_cols and len(po_df.columns) >= 14:
            p_t = p_t_cols[0]
            p_m = po_df.columns[13] # 밀크런 여부 열
            po_f = po_df[(po_df[p_t].str.contains("냉동", na=False)) & (po_df[p_m].str.contains("밀크런", na=False))]
            for _, row in po_f.iterrows():
                combined_rows.append([row.iloc[7], row.iloc[8], row.iloc[0], row.iloc[2], row.iloc[6], row.iloc[25]])

        # --- C. 검품내역 처리 ---
        check_buf = await f_check.arrayBuffer()
        check_df = pd.read_excel(io.BytesIO(Uint8Array.new(check_buf).to_py())).astype(str)
        for _, row in check_df.iterrows():
            if len(row) >= 6:
                combined_rows.append([row.iloc[0], row.iloc[1], row.iloc[2], row.iloc[3], row.iloc[4], row.iloc[5]])

        if not combined_rows:
            raise Exception("추출할 수 있는 조건(냉동/밀크런 등)의 데이터가 없습니다.")

        # --- D. 양식에 주입 ---
        target_buf = await f_target.arrayBuffer()
        target_bytes = io.BytesIO(Uint8Array.new(target_buf).to_py())
        output_df = pd.DataFrame(combined_rows)
        
        # openpyxl로 기존 양식 보존하며 덮어쓰기
        with pd.ExcelWriter(target_bytes, engine='openpyxl', mode='a', if_sheet_exists='overlay') as writer:
            output_df.to_excel(writer, sheet_name='RCV Check', startrow=1, index=False, header=False)

        # 결과 표시
        if new_skus and any(new_skus):
            sku_area.style.display = "block"
            sku_list_span.innerText = ", ".join([s for s in new_skus if s])

        target_bytes.seek(0)
        final_blob = Blob.new([Uint8Array.new(target_bytes.read())], {"type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})
        url = URL.createObjectURL(final_blob)
        
        status.innerText = f"완료! {len(combined_rows)}개 데이터를 통합했습니다."
        dl_area.style.display = "block"
        
        def dl_handler(e):
            a = document.createElement("a"); a.href = url; a.download = "RCV_결과파일.xlsx"; a.click()
        from pyodide.ffi import create_proxy
        document.getElementById("dl-btn").onclick = create_proxy(dl_handler)

    except Exception as e:
        status.className = "error"
        status.style.display = "block"
        status.innerText = f"오류 발생: {str(e)}"
    finally:
        btn.disabled = False

from pyodide.ffi import create_proxy
document.getElementById("run-btn").addEventListener("click", create_proxy(process))
</script>
</body>
</html>
