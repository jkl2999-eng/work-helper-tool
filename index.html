<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>RCV 자동화 시스템</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        html, body { height: 100%; margin: 0; display: flex; justify-content: center; align-items: center; background-color: #f0f2f5; }
        .container { width: 90%; max-width: 500px; background: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 20px; }
        .file-group { text-align: left; margin-bottom: 12px; padding: 12px; border: 1px solid #e8eaed; border-radius: 8px; background: #fafafa; }
        .file-group label { display: block; font-weight: bold; margin-bottom: 6px; color: #5f6368; font-size: 13px; }
        input[type="file"] { width: 100%; font-size: 12px; }
        button { width: 100%; background-color: #1a73e8; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background-color: #dadce0; cursor: not-allowed; }
        #status { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; font-weight: bold; border: 1px solid #1a73e8; background-color: #e8f0fe; color: #1967d2; }
        .error { background-color: #fce8e6 !important; color: #c5221f !important; border: 1px solid #c5221f !important; }
        #new-sku-area { display:none; background-color: #fff4e5; border-left: 5px solid #ffa000; padding: 12px; margin-top: 15px; text-align: left; font-size: 13px; }
        #download-area { margin-top: 20px; display: none; padding: 15px; border: 2px solid #34a853; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 RCV 자동 통합</h2>
    <div class="file-group"><label>📁 1. 통합 양식 파일</label><input type="file" id="target-file"></div>
    <div class="file-group"><label>📄 2. TruckShipment</label><input type="file" id="src-ts"></div>
    <div class="file-group"><label>📋 3. PO_SKU_LIST</label><input type="file" id="src-po"></div>
    <div class="file-group"><label>📑 4. 검품내역</label><input type="file" id="src-check"></div>

    <button id="run-btn" onclick="preProcess()">분석 및 통합 시작</button>

    <div id="status"></div>
    <div id="new-sku-area"><strong>📢 [New SKU 감지]</strong><br><span id="new-sku-list"></span></div>
    <div id="download-area"><p style="color: #2e7d32; font-weight: bold;">✅ 통합 완료!</p><button id="dl-btn" style="background-color: #34a853;">파일 다운로드</button></div>
</div>

<script>
    function preProcess() {
        const s = document.getElementById("status");
        const b = document.getElementById("run-btn");
        s.style.display = "block";
        s.className = "info";
        s.innerText = "⏳ 데이터 분석 중... 잠시만 기다려주세요.";
        b.disabled = true;
        
        setTimeout(() => {
            window.dispatchEvent(new CustomEvent('start-python-logic'));
        }, 100);
    }
</script>

<py-config>
    packages = ["pandas", "openpyxl"]
</py-config>

<script type="py">
import pandas as pd
import io
from pyscript import window
from js import document, Uint8Array, Blob, URL, CustomEvent

async def python_logic(event):
    status = document.getElementById("status")
    dl_area = document.getElementById("download-area")
    sku_area = document.getElementById("new-sku-area")
    btn = document.getElementById("run-btn")

    try:
        f_target = document.getElementById("target-file").files.item(0)
        f_ts = document.getElementById("src-ts").files.item(0)
        f_po = document.getElementById("src-po").files.item(0)
        f_check = document.getElementById("src-check").files.item(0)

        if not f_target or not f_ts or not f_po or not f_check:
            window.alert("4개의 파일을 모두 선택해야 합니다!")
            status.style.display = "none"
            btn.disabled = False
            return

        rcv_rows = []
        check_rows = []
        new_skus = []

        # 1. TruckShipment (V열 21번 인덱스)
        ts_buf = await f_ts.arrayBuffer()
        ts_df = pd.read_excel(io.BytesIO(Uint8Array.new(ts_buf).to_py())).astype(str)
        t_idx = 21 if len(ts_df.columns) > 21 else len(ts_df.columns) - 1
        
        mask_new = ts_df.iloc[:, t_idx].str.contains("NEW", case=False, na=False)
        new_skus = ts_df[mask_new].iloc[:, 13].replace('nan', '').unique().tolist()
        
        ts_f = ts_df[ts_df.iloc[:, t_idx].str.contains("냉동", na=False)]
        for _, row in ts_f.iterrows():
            rcv_rows.append([row.iloc[1], row.iloc[2], row.iloc[11], row.iloc[13], row.iloc[14], row.iloc[20]])

        # 2. PO_SKU_LIST
        po_buf = await f_po.arrayBuffer()
        po_df = pd.read_excel(io.BytesIO(Uint8Array.new(po_buf).to_py())).astype(str)
        p_t_cols = [i for i, c in enumerate(po_df.columns) if "온도" in str(c)]
        p_idx = p_t_cols[0] if p_t_cols else 19
        po_f = po_df[(po_df.iloc[:, p_idx].str.contains("냉동", na=False)) & (po_df.iloc[:, 13].str.contains("밀크런", na=False))]
        for _, row in po_f.iterrows():
            rcv_rows.append([row.iloc[7], row.iloc[8], row.iloc[0], row.iloc[2], row.iloc[6], row.iloc[25]])

        # 3. 검품내역 (검품 시트용 리스트에 따로 담기)
        c_buf = await f_check.arrayBuffer()
        c_df = pd.read_excel(io.BytesIO(Uint8Array.new(c_buf).to_py())).astype(str)
        for _, row in c_df.iterrows():
            check_rows.append(row.tolist())

        # 4. 양식 주입
        target_buf = await f_target.arrayBuffer()
        target_io = io.BytesIO(Uint8Array.new(target_buf).to_py())
        from openpyxl import load_workbook
        wb = load_workbook(target_io)
        
        # RCV Check 시트 주입
        if 'RCV Check' in wb.sheetnames:
            ws_rcv = wb['RCV Check']
            for row in ws_rcv.iter_rows(min_row=2, max_row=500, min_col=1, max_col=6):
                for cell in row: cell.value = None
            for r_idx, r_data in enumerate(rcv_rows, start=2):
                for c_idx, val in enumerate(r_data, start=1):
                    ws_rcv.cell(row=r_idx, column=c_idx, value=val)

        # 검품내역 시트 주입 (따로 분류해서 갱신)
        if '검품내역' in wb.sheetnames:
            ws_chk = wb['검품내역']
            for row in ws_chk.iter_rows(min_row=2, max_row=1000):
                for cell in row: cell.value = None
            for r_idx, r_data in enumerate(check_rows, start=2):
                for c_idx, val in enumerate(r_data, start=1):
                    ws_chk.cell(row=r_idx, column=c_idx, value=val)
        
        output = io.BytesIO()
        wb.save(output)
        output.seek(0)

        if new_skus and any(new_skus):
            sku_area.style.display = "block"
            document.getElementById("new-sku-list").innerText = ", ".join([str(s) for s in new_skus if s])

        url = URL.createObjectURL(Blob.new([Uint8Array.new(output.read())], {"type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}))
        status.innerText = f"✅ 통합 성공! (RCV: {len(rcv_rows)}건, 검품: {len(check_rows)}건)"
        dl_area.style.display = "block"
        
        def dl_handler(e):
            a = document.createElement("a"); a.href = url; a.download = "RCV_결과.xlsx"; a.click()
        from pyodide.ffi import create_proxy
        document.getElementById("dl-btn").onclick = create_proxy(dl_handler)

    except Exception as e:
        status.className = "error"
        status.innerText = f"❌ 오류: {str(e)}"
    finally:
        btn.disabled = False

from pyodide.ffi import create_proxy
window.addEventListener('start-python-logic', create_proxy(python_logic))
</script>
</body>
</html>
