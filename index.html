<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리시브 마감 자동화 도구</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 95%; max-width: 600px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #1e88e5; margin-bottom: 25px; }
        .file-box { text-align: left; background: #fafafa; padding: 20px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 20px; }
        .file-input { margin-bottom: 15px; display: flex; flex-direction: column; }
        .file-input span { font-weight: bold; margin-bottom: 8px; color: #555; font-size: 14px; }
        input[type="file"] { font-size: 13px; }
        button { padding: 16px; background-color: #1e88e5; color: white; border: none; cursor: pointer; border-radius: 8px; width: 100%; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #1565c0; }
        button:disabled { background-color: #dadce0; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 14px; font-weight: bold; background-color: #f8f9fa; border: 1px solid #eee; }
        .new-sku-box { background-color: #fff9c4; border-left: 5px solid #fbc02d; padding: 15px; margin-top: 20px; display: none; text-align: left; border-radius: 4px; font-size: 13px; }
        .sku-count { margin-top: 10px; font-weight: bold; color: #d32f2f; border-top: 1px solid #fbc02d; padding-top: 5px; }
        #download_area { display: none; margin-top: 30px; padding: 20px; border: 2px solid #4caf50; border-radius: 12px; background-color: #f1f8e9; }
        #download_link { font-size: 18px; color: #2e7d32; font-weight: bold; text-decoration: none; display: inline-block; padding: 10px 20px; background: #ffffff; border: 1px solid #4caf50; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 리시브 마감 자동화</h2>
    <div id="status">⏳ 시스템 초기화 중...</div>

    <div class="file-box">
        <div class="file-input"><span>📁 1. 마감 양식 (.xlsx)</span> <input type="file" id="target_file"></div>
        <div class="file-input"><span>📄 2. 검품 내역 (.xlsx)</span> <input type="file" id="check_file"></div>
        <div class="file-input"><span>📄 3. TruckShipment (.xlsx)</span> <input type="file" id="ts_file"></div>
        <div class="file-input"><span>📋 4. PO_SKU_LIST (.xlsx)</span> <input type="file" id="po_file"></div>
    </div>
    
    <button id="run_btn" disabled>🚀 공정 시작</button>
    
    <div id="sku_result" class="new-sku-box"></div>
    <div id="download_area">
        <p style="margin-bottom: 15px; font-weight: bold; color: #2e7d32;">🎉 작업이 완료되었습니다!</p>
        <a id="download_link">📥 [ 마감완료 파일 다운로드 ]</a>
    </div>
</div>

<py-config>
    packages = ["pandas", "openpyxl"]
</py-config>

<script type="py">
import pandas as pd
import openpyxl
import asyncio
import io
from pyscript import window
from js import Uint8Array, URL, document, Blob

status_el = document.getElementById("status")
run_btn = document.getElementById("run_btn")
status_el.innerHTML = "✅ 준비 완료! 파일을 선택해 주세요."
run_btn.disabled = False

async def process_files(event):
    status = document.getElementById("status")
    sku_div = document.getElementById("sku_result")
    dl_area = document.getElementById("download_area")
    
    status.innerHTML = "⏳ 공정 시작... (New SKU 분석 중)"
    status.style.backgroundColor = "#fff3cd"
    sku_div.style.display = "none"
    await asyncio.sleep(0.1)

    try:
        async def get_df(elem_id):
            file_el = document.getElementById(elem_id)
            if not file_el.files or file_el.files.length == 0: return None
            array_buf = await file_el.files.item(0).arrayBuffer()
            return pd.read_excel(io.BytesIO(array_buf.to_py()))

        target_file_el = document.getElementById("target_file")
        if not target_file_el.files.length:
            window.alert("마감 양식 파일이 없습니다!")
            return

        target_buf = await target_file_el.files.item(0).arrayBuffer()
        df_check = await get_df("check_file")
        df_ts = await get_df("ts_file")
        df_po = await get_df("po_file")

        # [1] New SKU 감지 (TruckShipment V열/22번째 기준)
        if df_ts is not None:
            # 모든 열 이름을 대문자로 통일하여 찾기
            df_ts.columns = [str(c).strip().upper() for c in df_ts.columns]
            temp_col = next((c for c in df_ts.columns if "온도" in c), None)
            id_col = next((c for c in df_ts.columns if "SKUID" in c), None)
            
            if temp_col and id_col:
                mask = df_ts[temp_col].astype(str).str.contains('NEW', case=False, na=False)
                # 숫자 ID가 소수점으로 나오는 현상 방지
                found_ids = df_ts.loc[mask, id_col].dropna().apply(lambda x: str(int(float(x))) if str(x).replace('.','').isdigit() else str(x)).unique().tolist()
                
                if found_ids:
                    sku_div.style.display = "block"
                    sku_div.innerHTML = f"📢 <b>New SKU 발견 리스트:</b><br>{', '.join(found_ids)}<div class='sku-count'>👉 총 {len(found_ids)}개의 New SKU가 발견되었습니다.</div>"

        # [2] 엑셀 주입 작업
        wb = openpyxl.load_workbook(io.BytesIO(target_buf.to_py()))
        
        # TRUCKSHIPMENT (U, V, W 수식 보존)
        ts_name = next((s for s in wb.sheetnames if s.upper() == "TRUCKSHIPMENT"), None)
        if ts_name and df_ts is not None:
            ws_ts = wb[ts_name]
            for r in ws_ts.iter_rows(min_row=2, max_row=ws_ts.max_row, min_col=1, max_col=20):
                for cell in r: cell.value = None
            if ws_ts.max_column >= 24:
                for r in ws_ts.iter_rows(min_row=2, max_row=ws_ts.max_row, min_col=24, max_col=ws_ts.max_column):
                    for cell in r: cell.value = None
            
            ts_data = df_ts.values.tolist()
            for r_idx, row_vals in enumerate(ts_data, 2):
                for c_idx, val in enumerate(row_vals, 1):
                    if c_idx not in [21, 22, 23]: # U, V, W 보호
                        ws_ts.cell(row=r_idx, column=c_idx, value=val if pd.notna(val) else "")

        # PO_SKU_LIST (BC열까지 삭제)
        po_name = next((s for s in wb.sheetnames if "PO" in s.upper()), None)
        if po_name and df_po is not None:
            ws_po = wb[po_name]
            for r in ws_po.iter_rows(min_row=2, max_row=ws_po.max_row, min_col=1, max_col=55):
                for cell in r: cell.value = None
            
            po_data = df_po.values.tolist()
            for r_idx, row_vals in enumerate(po_data, 2):
                for c_idx, val in enumerate(row_vals, 1):
                    if c_idx <= 55: # BC열까지 주입
                        ws_po.cell(row=r_idx, column=c_idx, value=val if pd.notna(val) else "")

        # 검품 내역 주입
        chk_name = next((s for s in wb.sheetnames if "검품" in s), None)
        if chk_name and df_check is not None:
            ws_chk = wb[chk_name]
            if ws_chk.max_row >= 2: ws_chk.delete_rows(2, ws_chk.max_row)
            for r_idx, row_vals in enumerate(df_check.values.tolist(), 2):
                for c_idx, val in enumerate(row_vals, 1):
                    ws_chk.cell(row=r_idx, column=c_idx, value=val if pd.notna(val) else "")

        # [3] 최종 저장
        status.innerHTML = "⏳ 결과 파일 생성 중..."
        await asyncio.sleep(0.05)
        out_buf = io.BytesIO()
        wb.save(out_buf)
        processed_blob = Blob.new([Uint8Array.new(out_buf.getvalue())], { "type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" })
        
        link = document.getElementById("download_link")
        link.href = URL.createObjectURL(processed_blob)
        link.download = "마감완료_최종.xlsx"
        
        dl_area.style.display = "block"
        status.innerHTML = "✅ 모든 작업이 완료되었습니다!"
        status.style.backgroundColor = "#c8e6c9"

    except Exception as e:
        status.innerHTML = f"❌ 오류 발생: {str(e)}"
        status.style.backgroundColor = "#ffcdd2"

run_btn.onclick = process_files
</script>
</body>
</html>
