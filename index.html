<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>물류 데이터 통합 툴</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; line-height: 1.6; background-color: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; margin-top: 0; }
        .upload-section { border: 2px dashed #dadce0; padding: 30px; text-align: center; border-radius: 8px; margin: 20px 0; background-color: #fafafa; }
        .file-info { font-size: 0.9em; color: #5f6368; margin-top: 10px; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #1765cc; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin: 15px 0; font-weight: bold; padding: 10px; border-radius: 4px; display: none; }
        .status-loading { background-color: #e8f0fe; color: #1967d2; display: block !important; }
        .status-success { background-color: #e6f4ea; color: #137333; display: block !important; }
        .status-error { background-color: #fce8e6; color: #c5221f; display: block !important; }
        #download-area { margin-top: 20px; display: none; text-align: center; padding: 20px; border: 1px solid #e1e4e8; border-radius: 8px; }
        .new-sku-box { background-color: #fff4e5; border-left: 5px solid #ffa000; padding: 15px; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 물류 데이터 통합 시스템 (4개 파일 통합형)</h2>
    <p>양식 파일(Target) 1개와 소스 파일 3개를 포함하여 총 4개의 파일을 선택해 주세요.</p>
    
    <div class="upload-section">
        <input type="file" id="file-input" multiple accept=".xlsx, .xls">
        <p class="file-info">※ 양식 파일 내에 'RCV Check' 시트가 반드시 있어야 합니다.</p>
        <button id="process-btn">데이터 분석 및 통합 시작</button>
    </div>

    <div id="status"></div>
    
    <div id="new-sku-area" class="new-sku-box">
        <strong>📢 [New SKU 감지]</strong><br>
        보안 사이트에서 다음 SKU들을 먼저 조회하세요:<br>
        <span id="new-sku-list"></span>
    </div>

    <div id="download-area">
        <p>✅ 처리가 완료되었습니다. 통합된 결과 파일을 다운로드하세요.</p>
        <button id="download-btn" style="background-color: #34a853;">통합 파일 다운로드 (.xlsx)</button>
    </div>
</div>

<py-config>
    packages = ["pandas", "openpyxl"]
</py-config>

<script type="py">
import pandas as pd
import io
from pyscript import window, display
from js import document, Uint8Array, Blob, URL

async def run_integration(event):
    btn = document.getElementById("process-btn")
    status = document.getElementById("status")
    download_area = document.getElementById("download-area")
    sku_area = document.getElementById("new-sku-area")
    
    files = document.getElementById("file-input").files
    if len(files) < 4:
        window.alert("양식 파일 1개와 소스 파일 3개, 총 4개의 파일을 선택해 주세요.")
        return

    btn.disabled = True
    status.className = "status-loading"
    status.innerText = "파이썬 엔진 및 데이터 처리 중..."
    
    target_wb_bytes = None
    new_skus = []
    combined_rows = []

    try:
        # 1. 파일 분류 및 읽기
        for file in files:
            array_buf = await file.arrayBuffer()
            content = Uint8Array.new(array_buf).to_py()
            file_bytes = io.BytesIO(content)
            
            # 임시로 시트 확인을 위해 ExcelFile 사용
            xl = pd.ExcelFile(file_bytes)
            
            # (A) 양식 파일 찾기 (RCV Check 시트 기준)
            if "RCV Check" in xl.sheet_names:
                target_wb_bytes = file_bytes
                continue
            
            # (B) 소스 파일 분석
            df = pd.read_excel(xl, sheet_name=0)
            
            # TruckShipment 판별 (V열 부근 '온도' 헤더)
            if len(df.columns) >= 22 and "온도" in str(df.columns[21]):
                # New SKU 추출
                new_mask = df.iloc[:, 21].astype(str).str.contains("NEW", na=False)
                new_skus.extend(df[new_mask].iloc[:, 13].dropna().unique().tolist())
                
                # 냉동 데이터 추출
                frozen_mask = df.iloc[:, 21].astype(str).str.contains("냉동", na=False)
                ts_data = df[frozen_mask]
                for _, row in ts_data.iterrows():
                    combined_rows.append({
                        '업체ID': row.iloc[1], '업체명': row.iloc[2], '발주번호': row.iloc[11],
                        'SKUID': row.iloc[13], '상품명': row.iloc[14], '수량': row.iloc[20]
                    })
            
            # PO_SKU_LIST 판별 (M열 부근 '온도' 헤더)
            elif len(df.columns) >= 14 and "온도" in str(df.columns[12]):
                cond = (df.iloc[:, 12].astype(str).str.contains("냉동", na=False)) &                        (df.iloc[:, 13].astype(str).str.contains("밀크런", na=False))
                po_data = df[cond]
                for _, row in po_data.iterrows():
                    combined_rows.append({
                        '업체ID': row.iloc[7], '업체명': row.iloc[8], '발주번호': row.iloc[0],
                        'SKUID': row.iloc[2], '상품명': row.iloc[6], '수량': row.iloc[25]
                    })

        if target_wb_bytes is None:
            raise Exception("양식 파일('RCV Check' 시트 포함)을 찾을 수 없습니다.")

        # 2. 양식 파일에 데이터 주입
        target_wb_bytes.seek(0)
        output_df = pd.DataFrame(combined_rows)
        
        # openpyxl을 사용해 기존 시트의 2행부터 쓰기
        with pd.ExcelWriter(target_wb_bytes, engine='openpyxl', mode='a', if_sheet_exists='overlay') as writer:
            output_df.to_excel(writer, sheet_name='RCV Check', startrow=1, index=False, header=False)
        
        # 3. 결과 파일 생성 (Blob 변환)
        target_wb_bytes.seek(0)
        final_content = target_wb_bytes.read()
        js_array = Uint8Array.new(final_content)
        blob = Blob.new([js_array], { "type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" })
        url = URL.createObjectURL(blob)
        
        # 4. 화면 업데이트
        status.className = "status-success"
        status.innerText = "RCV CHECK 채우기 끝!"
        
        if new_skus:
            sku_area.style.display = "block"
            document.getElementById("new-sku-list").innerText = ", ".join(map(str, set(new_skus)))
            
        download_area.style.display = "block"
        
        # 다운로드 버튼 이벤트 설정
        def download_file(e):
            anchor = document.createElement("a")
            anchor.href = url
            anchor.download = "RCV_Check_Result_Combined.xlsx"
            anchor.click()
            
        from pyodide.ffi import create_proxy
        document.getElementById("download-btn").onclick = create_proxy(download_file)

    except Exception as e:
        status.className = "status-error"
        status.innerText = f"오류 발생: {str(e)}"
    finally:
        btn.disabled = False

# 버튼 이벤트 리스너 등록
from pyodide.ffi import create_proxy
document.getElementById("process-btn").addEventListener("click", create_proxy(run_integration))
</script>

</body>
</html>
