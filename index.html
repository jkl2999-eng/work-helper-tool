<script type="py">
import pandas as pd
import openpyxl
import asyncio
import io
from pyscript import window
from js import Uint8Array, URL, document, Blob

status_el = document.getElementById("status")
run_btn = document.getElementById("run_btn")
status_el.innerHTML = "✅ 준비 완료! 파일을 선택해 주세요."
run_btn.disabled = False

async def process_files(event):
    status = document.getElementById("status")
    sku_div = document.getElementById("sku_result")
    dl_area = document.getElementById("download_area")
    
    status.innerHTML = "⏳ 공정 시작..."
    status.style.backgroundColor = "#fff3cd"

    try:
        async def get_df(elem_id):
            file_el = document.getElementById(elem_id)
            if not file_el.files or file_el.files.length == 0: return None
            array_buf = await file_el.files.item(0).arrayBuffer()
            return pd.read_excel(io.BytesIO(array_buf.to_py()))

        target_file_el = document.getElementById("target_file")
        if not target_file_el.files.length:
            window.alert("마감 양식 파일이 없습니다!")
            return

        target_buf = await target_file_el.files.item(0).arrayBuffer()
        df_check = await get_df("check_file")
        df_ts = await get_df("ts_file")
        df_po = await get_df("po_file")

        wb = openpyxl.load_workbook(io.BytesIO(target_buf.to_py()))
        
        # [1] TRUCKSHIPMENT 주입 (U, V, W열 21, 22, 23번 수식 보존)
        ts_name = next((s for s in wb.sheetnames if s.upper() == "TRUCKSHIPMENT"), None)
        if ts_name and df_ts is not None:
            ws_ts = wb[ts_name]
            # 데이터 영역만 지우기 (U, V, W 제외)
            for r in range(2, ws_ts.max_row + 1):
                for c in range(1, 21): ws_ts.cell(r, c).value = None 
                for c in range(24, ws_ts.max_column + 1): ws_ts.cell(r, c).value = None
            # 데이터 입력
            for r_idx, row in enumerate(df_ts.values.tolist(), 2):
                for c_idx, val in enumerate(row, 1):
                    if c_idx not in [21, 22, 23]:
                        ws_ts.cell(row=r_idx, column=c_idx, value=val if pd.notna(val) else "")

        # [2] PO_SKU_LIST 주입 (BC열까지 데이터 날리기)
        po_name = next((s for s in wb.sheetnames if "PO" in s.upper()), None)
        if po_name and df_po is not None:
            ws_po = wb[po_name]
            # BC열은 55번째 열입니다. 2행부터 BC열(55)까지만 데이터를 삭제합니다.
            for r in range(2, ws_po.max_row + 1):
                for c in range(1, 56): # 1(A)부터 55(BC)까지 삭제
                    ws_po.cell(r, c).value = None
            
            # 소스 데이터 주입 (BC열 범위 내에서만)
            for r_idx, row in enumerate(df_po.values.tolist(), 2):
                for c_idx, val in enumerate(row, 1):
                    if c_idx <= 55: # BC열까지만 주입
                        ws_po.cell(row=r_idx, column=c_idx, value=val if pd.notna(val) else "")

        # [3] RCV Check 및 검품내역 등 기타 로직 수행
        # ... (기존 시트 데이터 생성 로직 동일) ...

        status.innerHTML = "⏳ 최종 파일 생성 중..."
        out_buf = io.BytesIO()
        wb.save(out_buf)
        processed_blob = Blob.new([Uint8Array.new(out_buf.getvalue())], { "type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" })
        
        download_link = document.getElementById("download_link")
        download_link.href = URL.createObjectURL(processed_blob)
        download_link.download = "리시브_마감_결과.xlsx"
        
        dl_area.style.display = "block"
        status.innerHTML = "✅ 모든 작업이 완료되었습니다!"
        status.style.backgroundColor = "#c8e6c9"

    except Exception as e:
        status.innerHTML = f"❌ 오류 발생: {str(e)}"
        status.style.backgroundColor = "#ffcdd2"

run_btn.onclick = process_files
</script>
